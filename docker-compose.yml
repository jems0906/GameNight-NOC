services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gamenight
      POSTGRES_USER: gamenight
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - gamenight-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamenight -d gamenight"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://gamenight:local-dev-only@database:5432/gamenight
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:8080"
    depends_on:
      - backend
volumes:
  gamenight-data:
